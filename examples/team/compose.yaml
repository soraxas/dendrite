# Infrastructure for a dendrite server: Postgres for lineage, MinIO as the bucket.
# Only the dendrite server talks to these; clients get presigned URLs for MinIO.
name: dendrite-team

services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: dendrite
      POSTGRES_PASSWORD: dendrite
      POSTGRES_DB: dendrite
    ports: ["127.0.0.1:15434:5432"]
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dendrite"]
      interval: 2s
      retries: 30

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: dendrite
      MINIO_ROOT_PASSWORD: dendrite-secret
    # Browsers download straight from here with presigned URLs, so it must be reachable from them.
    ports: ["127.0.0.1:19100:9000", "127.0.0.1:19101:9001"]
    volumes: [blobs:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      retries: 30

  bucket:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 dendrite dendrite-secret &&
             mc mb --ignore-existing local/lineage"

  # Optional: the server itself, from this repo's Dockerfile. `docker compose --profile server up -d`
  server:
    profiles: [server]
    build: { context: ../.., dockerfile: Dockerfile }
    image: dendrite-server:dev
    depends_on:
      db: { condition: service_healthy }
    ports: ["127.0.0.1:8456:8455"]
    volumes:
      - ./server.docker.toml:/etc/dendrite/server.toml:ro
      - server:/var/lib/dendrite

volumes:
  db:
  blobs:
  server:
