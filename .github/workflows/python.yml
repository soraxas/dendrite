name: python

# Only when something the Python tests exercise changes: a docs-only push runs nothing.
on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "pyproject.toml"
      - "uv.lock"
      - "hatch_build.py"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "pyproject.toml"
      - "uv.lock"
      - "hatch_build.py"
      - ".github/workflows/python.yml"

env:
  DO_NOT_TRACK: "1"

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # remote: the whole suite again, with `lab` backed by an in-process dendrite server
        # (Postgres + moto S3), as a teammate's client would use it.
        db: [sqlite, postgres, remote]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: pytest
        # Every job also runs tests/test_postgres.py against a throwaway postgres:17-alpine
        # container (testcontainers); DENDRITE_TEST_PG=require fails instead of skipping.
        # The postgres job additionally runs the whole suite on Postgres.
        env:
          DENDRITE_TEST_DB: ${{ matrix.db }}
          DENDRITE_TEST_REMOTE: ${{ matrix.db == 'remote' && '1' || '' }}
          DENDRITE_TEST_PG: require
        run: uv run pytest -q
