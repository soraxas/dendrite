name: python

# Only when something the Python tests exercise changes: a docs-only push runs nothing.
on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "pyproject.toml"
      - "uv.lock"
      - "hatch_build.py"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "pyproject.toml"
      - "uv.lock"
      - "hatch_build.py"
      - ".github/workflows/python.yml"

env:
  # dendrite builds against a Prefect checkout at ../prefect ([tool.uv.sources] in pyproject.toml).
  # Bump this together with your local ../prefect.
  PREFECT_SHA: 7d1688ff034a89a47c900c0e2951c78ff1979f0d
  DO_NOT_TRACK: "1"

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: Check out Prefect at the pinned commit
        # Blobless rather than shallow: versioningit reads Prefect's version from its git tags.
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/PrefectHQ/prefect ../prefect
          git -C ../prefect checkout --quiet "$PREFECT_SHA"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: pytest
        # Every job also runs tests/test_postgres.py against a throwaway postgres:17-alpine
        # container (testcontainers); DENDRITE_TEST_PG=require fails instead of skipping.
        # The postgres job additionally runs the whole suite on Postgres.
        env:
          DENDRITE_TEST_DB: ${{ matrix.db }}
          DENDRITE_TEST_PG: require
        run: uv run pytest -q
