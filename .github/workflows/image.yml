name: image

# The server image builds whenever what goes into it changes (it isn't pushed anywhere).
on:
  push:
    paths:
      - "src/**"
      - "ui/**"
      - "pyproject.toml"
      - "hatch_build.py"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/image.yml"
  pull_request:
    paths:
      - "src/**"
      - "ui/**"
      - "pyproject.toml"
      - "hatch_build.py"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/image.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build the server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - run: docker build -t dendrite-server:ci .
      - name: The image starts and imports
        run: docker run --rm --entrypoint dendrite dendrite-server:ci --help > /dev/null
