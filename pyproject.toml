[project]
name = "dendrite"
version = "0.1.0"
description = "Artifact-first experiment lineage, global caching and forking on Prefect 3"
authors = [
    { name = "Tin Lai", email = "tin@tinyiu.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "fsspec>=2024.1",
    "prefect>=3",
    "sqlalchemy>=2.0",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.1",
]
s3 = [
    "s3fs>=2024.1",
]

[project.scripts]
dendrite = "dendrite.cli:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dendrite[postgres,s3]",
    "httpx>=0.28.1",
    "moto[server]>=5.2.4",
    "pytest>=9.1.1",
]

[tool.uv.sources]
prefect = { path = "../prefect", editable = true }
dendrite = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
