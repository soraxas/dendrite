[project]
name = "dendrite"
version = "0.1.0"
description = "Artifact-first experiment lineage, global caching and forking on Prefect 3"
authors = [
    { name = "Tin Lai", email = "tin@tinyiu.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "fsspec>=2024.1",
    "prefect>=3",
    "sqlalchemy>=2.0",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.1",
]
s3 = [
    "s3fs>=2024.1",
]

[project.scripts]
dendrite = "dendrite.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build]
# The UI bundle is git-ignored (built by scripts/build-ui.sh); list it so it is still packaged.
artifacts = ["src/dendrite/ui/dist"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["/src/dendrite", "/README.md", "/pyproject.toml", "/hatch_build.py"]

[tool.hatch.build.targets.wheel]
packages = ["src/dendrite"]

[dependency-groups]
dev = [
    "dendrite[postgres,s3]",
    "httpx>=0.28.1",
    "moto[server]>=5.2.4",
    "pytest>=9.1.1",
    "testcontainers>=4.15",
]

[tool.uv.sources]
prefect = { path = "../prefect", editable = true }
dendrite = { workspace = true }

[tool.prefect.server]
analytics_enabled = false

[tool.pytest.ini_options]
testpaths = ["tests"]
