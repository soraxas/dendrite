<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dendrite Lineage</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1c1e21; --muted: #6b7076; --line: #e3e3df; --line-strong: #c9c9c3;
  --accent: #3b5bdb; --hover: #f0f1ee; --chip: #eef0f3; --edge: #a8adb3;
  --computed: #2f9e44; --computed-bg: #ebf7ee;
  --cached: #1971c2; --cached-bg: #e7f1fb;
  --pinned: #e8590c; --pinned-bg: #fff1e6;
  --running: #f08c00; --running-bg: #fff6df;
  --waiting: #f08c00; --waiting-bg: #fff9ec;
  --queued: #868e96; --queued-bg: #f3f3f1;
  --failed: #e03131; --failed-bg: #fdecec;
  --input: #495057; --input-bg: #ffffff;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131416; --panel: #1b1d20; --ink: #e6e6e3; --muted: #9a9fa5; --line: #2b2e33; --line-strong: #3a3e44;
    --accent: #7c95f5; --hover: #24272b; --chip: #26292e; --edge: #5c636b;
    --computed: #51cf66; --computed-bg: #17301e;
    --cached: #4dabf7; --cached-bg: #132a3e;
    --pinned: #ff922b; --pinned-bg: #3a2413;
    --running: #fcc419; --running-bg: #3a3112;
    --waiting: #fcc419; --waiting-bg: #2e2914;
    --queued: #909296; --queued-bg: #222427;
    --failed: #ff6b6b; --failed-bg: #3d1a1a;
    --input: #ced4da; --input-bg: #1b1d20;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent); text-decoration: none; cursor: pointer; }
a:hover { text-decoration: underline; }
code, .mono { font-family: var(--mono); font-size: 12px; }
button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover { background: var(--hover); }
button.active { border-color: var(--accent); color: var(--accent); }
select { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 6px; padding: 3px 6px; }

.app { display: grid; grid-template-columns: 290px 1fr 360px; grid-template-rows: 48px 1fr; height: 100vh; }
header { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
header .brand { font-weight: 650; letter-spacing: .2px; }
header .meta { color: var(--muted); font-size: 12px; margin-left: auto; font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--computed); display: inline-block; }
.live.off i { background: var(--queued); }

aside.sidebar { border-right: 1px solid var(--line); overflow: auto; background: var(--panel); }
.side-head { padding: 12px 14px 6px; display: flex; gap: 8px; align-items: center; }
.side-head input { flex: 1; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
.tree { list-style: none; margin: 0; padding: 4px 6px 16px; }
.tree li { list-style: none; }
.exp { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; min-width: 0; }
.exp:hover { background: var(--hover); }
.exp.sel { background: var(--chip); box-shadow: inset 2px 0 0 var(--accent); }
.exp .nm { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.exp .sub { color: var(--muted); font-size: 11.5px; font-family: var(--mono); }
.exp .txt { min-width: 0; flex: 1; }
.exp .bar { display: flex; height: 4px; border-radius: 2px; overflow: hidden; margin-top: 4px; background: var(--line); }
.exp .bar span { display: block; height: 100%; }
.children { padding-left: 14px; margin-left: 12px; border-left: 1px dashed var(--line-strong); }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }

main { position: relative; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.toolbar h2 { margin: 0 8px 0 0; font-size: 16px; font-weight: 650; }
.toolbar .spacer { flex: 1; }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 550; border: 1px solid currentColor; }
.view { flex: 1; overflow: auto; position: relative; }
.canvas { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; }
.canvas.dragging { cursor: grabbing; }
.legend { position: absolute; left: 16px; bottom: 12px; display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); background: color-mix(in srgb, var(--bg) 85%, transparent); padding: 4px 8px; border-radius: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.zoom { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 4px; }
.empty { padding: 48px; color: var(--muted); text-align: center; }
.pad { padding: 16px 20px; }

aside.detail { border-left: 1px solid var(--line); overflow: auto; background: var(--panel); }
.detail section { padding: 14px 16px; border-bottom: 1px solid var(--line); }
.detail h3 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); font-weight: 600; }
.detail h4 { margin: 0 0 6px; font-size: 16px; }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 4px 10px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; margin: 2px 4px 2px 0; border-radius: 6px; background: var(--chip); font-size: 12px; cursor: pointer; border: 1px solid transparent; max-width: 100%; }
.chip:hover { border-color: var(--accent); }
.chip b { font-weight: 600; }
pre { margin: 0; padding: 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; font: 12px/1.4 var(--mono); max-height: 320px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; }
td.num { font-variant-numeric: tabular-nums; text-align: right; }
.err { color: var(--failed); }

svg text { fill: var(--ink); font-family: system-ui, sans-serif; }
.node rect.box { stroke-width: 1.5; }
.node { cursor: pointer; }
.node:hover rect.box { stroke-width: 2.5; }
.node.sel rect.box { stroke-width: 3; }
.node .t1 { font-size: 13px; font-weight: 600; }
.node .t2 { font-size: 11px; fill: var(--muted); }
.node .t3 { font-size: 10.5px; fill: var(--muted); font-family: var(--mono); }
.edge path { fill: none; stroke: var(--edge); stroke-width: 1.5; }
.edge.hl path { stroke: var(--accent); stroke-width: 2.2; }
.edge text { font-size: 10.5px; fill: var(--muted); font-family: var(--mono); }
.edge rect { fill: var(--bg); }
.running rect.box, .waiting rect.box { stroke-dasharray: 6 4; animation: march 0.9s linear infinite; }
@keyframes march { to { stroke-dashoffset: -20; } }
.queued rect.box { stroke-dasharray: 3 3; }
@media (prefers-reduced-motion: reduce) { .running rect.box, .waiting rect.box { animation: none; } }

@media (max-width: 1100px) {
  .app { grid-template-columns: 240px 1fr; }
  aside.detail { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); max-height: 45vh; }
  .app { grid-template-rows: 48px 1fr auto; height: auto; min-height: 100vh; }
  main { min-height: 60vh; }
}
@media (max-width: 700px) {
  .app { grid-template-columns: 1fr; }
  aside.sidebar { max-height: 30vh; border-right: 0; border-bottom: 1px solid var(--line); }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="brand">dendrite</span>
    <span class="live" id="live"><i></i><span>live</span></span>
    <span class="meta" id="meta"></span>
  </header>
  <aside class="sidebar">
    <div class="side-head"><input id="filter" placeholder="Filter experiments…" aria-label="Filter experiments"></div>
    <ul class="tree" id="tree"></ul>
  </aside>
  <main>
    <div class="toolbar" id="toolbar"></div>
    <div class="view" id="view"><div class="empty">Select an experiment.</div></div>
  </main>
  <aside class="detail" id="detail"><section><h3>Details</h3><div style="color:var(--muted)">Select a node or artifact.</div></section></aside>
</div>
<script>
"use strict";
const STATUSES = ["computed", "cached", "pinned", "running", "waiting", "queued", "failed"];
const ACTIVE = new Set(["running", "waiting", "queued"]);
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const short = (h, n = 10) => (h ? String(h).slice(0, n) : "");
const fmtDur = (s) => s == null ? "" : s < 1 ? `${(s * 1000).toFixed(0)}ms` : s < 120 ? `${s.toFixed(1)}s` : `${(s / 60).toFixed(1)}m`;
const fmtSize = (b) => b == null ? "" : b < 1024 ? `${b} B` : b < 1048576 ? `${(b / 1024).toFixed(1)} KB` : b < 1073741824 ? `${(b / 1048576).toFixed(1)} MB` : `${(b / 1073741824).toFixed(2)} GB`;
const fmtTime = (t) => t ? new Date(t * 1000).toLocaleString() : "";
const fmtVal = (v) => typeof v === "number" ? (Number.isInteger(v) ? String(v) : v.toPrecision(5)) : v === undefined ? "—" : JSON.stringify(v);
const cssVar = (n) => `var(--${n})`;

async function api(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error(`${r.status} ${(await r.text()).slice(0, 200)}`);
  return r.json();
}

const state = {
  route: { view: "dag" }, tree: [], dag: null, lineage: null, diff: null,
  selected: null, transform: null, fitKey: null, timer: null, filter: "",
};

// ---------------------------------------------------------------- routing
function parseRoute() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean).map(decodeURIComponent);
  if (parts[0] === "exp" && parts[1]) {
    const r = { view: parts[2] || "dag", exp: parts[1] };
    if (r.view === "diff") r.other = parts[3];
    return r;
  }
  if (parts[0] === "artifact" && parts[1]) return { view: "lineage", artifact: parts[1], exp: parts[3] };
  return { view: "dag" };
}
function go(hash) { if (location.hash !== hash) location.hash = hash; else route(); }
window.addEventListener("hashchange", route);

async function route() {
  state.route = parseRoute();
  state.selected = null;
  await refresh(true);
}

// ---------------------------------------------------------------- polling
async function refresh(force = false) {
  clearTimeout(state.timer);
  let busy = false;
  try {
    state.tree = await api("/api/experiments");
    renderTree();
    const r = state.route;
    if (!r.exp && !r.artifact && state.tree.length) {
      const last = state.tree[state.tree.length - 1];
      location.replace(`#/exp/${last.id}`);
      return;
    }
    if (r.view === "lineage") {
      if (force || !state.lineage) state.lineage = await api(`/api/artifacts/${r.artifact}/lineage`);
      renderLineage();
    } else if (r.exp) {
      state.dag = await api(`/api/experiments/${r.exp}/dag`);
      busy = state.dag.experiment.status === "running" || state.dag.nodes.some((n) => ACTIVE.has(n.status));
      if (r.view === "diff") {
        if (r.other && (force || busy || !state.diff)) state.diff = await api(`/api/diff?a=${r.exp}&b=${r.other}`);
        renderDiff();
      } else if (r.view === "params") renderParams();
      else if (r.view === "metrics") renderMetrics();
      else renderDag();
      if (force && !state.selected) renderExperimentDetail();
      else if (state.selected?.type === "node") renderNodeDetail(state.selected.id, false);
    }
    $("#live").classList.toggle("off", !busy);
    $("#live span").textContent = busy ? "running" : "idle";
  } catch (e) {
    $("#view").innerHTML = `<div class="empty err">${esc(e.message)}</div>`;
  }
  state.timer = setTimeout(() => refresh(false), busy ? 1000 : 4000);
}

// ---------------------------------------------------------------- sidebar
function renderTree() {
  const byParent = new Map();
  const ids = new Set(state.tree.map((e) => e.id));
  for (const e of state.tree) {
    const p = e.parent_id && ids.has(e.parent_id) ? e.parent_id : null;
    if (!byParent.has(p)) byParent.set(p, []);
    byParent.get(p).push(e);
  }
  const f = state.filter.toLowerCase();
  const matches = (e) => !f || (e.name || "").toLowerCase().includes(f) || e.id.includes(f);
  const subtreeMatches = (e) => matches(e) || (byParent.get(e.id) || []).some(subtreeMatches);
  const sel = state.route.exp;
  const item = (e) => {
    if (!subtreeMatches(e)) return "";
    const total = Object.values(e.counts).reduce((a, b) => a + b, 0) || 1;
    const bar = STATUSES.filter((s) => e.counts[s]).map((s) => `<span style="width:${(100 * e.counts[s]) / total}%;background:${cssVar(s)}" title="${e.counts[s]} ${s}"></span>`).join("");
    const kids = (byParent.get(e.id) || []).map(item).join("");
    const color = e.status === "completed" ? "computed" : e.status === "created" ? "queued" : e.status;
    return `<li><div class="exp ${e.id === sel ? "sel" : ""}" data-id="${esc(e.id)}">
      <span class="dot" style="background:${cssVar(color)}"></span>
      <div class="txt"><div class="nm">${esc(e.name || e.id)}</div>
      <div class="sub">${esc(e.id)} · ${esc(e.status)}</div><div class="bar">${bar}</div></div></div>
      ${kids ? `<ul class="tree children">${kids}</ul>` : ""}</li>`;
  };
  $("#tree").innerHTML = (byParent.get(null) || []).slice().reverse().map(item).join("") || `<li class="empty">No experiments yet.</li>`;
}
$("#tree").addEventListener("click", (ev) => {
  const el = ev.target.closest(".exp");
  if (el) go(`#/exp/${el.dataset.id}`);
});
$("#filter").addEventListener("input", (ev) => { state.filter = ev.target.value; renderTree(); });

// ---------------------------------------------------------------- toolbar
function renderToolbar(exp) {
  const r = state.route;
  const tab = (v, label) => `<button class="${r.view === v ? "active" : ""}" data-go="#/exp/${exp.id}${v === "dag" ? "" : "/" + v}">${label}</button>`;
  const others = state.tree.filter((e) => e.id !== exp.id);
  const defaultOther = r.other || exp.parent_id || (others[0] && others[0].id) || "";
  const color = exp.status === "completed" ? "computed" : exp.status === "created" ? "queued" : exp.status;
  $("#toolbar").innerHTML = `
    <h2>${esc(exp.name || exp.id)}</h2>
    <span class="badge" style="color:${cssVar(color)}">${esc(exp.status)}</span>
    <span class="mono" style="color:var(--muted)">${esc(exp.id)}</span>
    ${exp.parent_id ? `<span style="color:var(--muted)">forked from <a data-go="#/exp/${esc(exp.parent_id)}">${esc(nameOf(exp.parent_id))}</a></span>` : ""}
    <span class="spacer"></span>
    ${tab("dag", "DAG")}${tab("params", "Params")}${tab("metrics", "Metrics")}
    <span style="display:${others.length ? "inline-flex" : "none"};gap:4px;align-items:center">
      <select id="diffWith" aria-label="Compare with">${others.map((o) => `<option value="${esc(o.id)}" ${o.id === defaultOther ? "selected" : ""}>${esc(o.name || o.id)}</option>`).join("")}</select>
      <button class="${r.view === "diff" ? "active" : ""}" id="diffBtn" ${others.length ? "" : "disabled"}>Compare</button>
    </span>`;
  $("#diffBtn").onclick = () => others.length && go(`#/exp/${exp.id}/diff/${$("#diffWith").value}`);
}
function nameOf(id) { const e = state.tree.find((x) => x.id === id); return e ? e.name || e.id : id; }
document.addEventListener("click", (ev) => {
  const g = ev.target.closest("[data-go]");
  if (g) { ev.preventDefault(); go(g.dataset.go); return; }
  const a = ev.target.closest("[data-artifact]");
  if (a) { ev.preventDefault(); selectArtifact(a.dataset.artifact); return; }
  const x = ev.target.closest("[data-exec]");
  if (x) { ev.preventDefault(); selectExecution(x.dataset.exec); }
});

// ---------------------------------------------------------------- layered DAG layout
function layout(nodes, edges, W, H, GX, GY) {
  const ids = new Set(nodes.map((n) => n.id));
  const preds = new Map(nodes.map((n) => [n.id, []]));
  const succs = new Map(nodes.map((n) => [n.id, []]));
  for (const e of edges) if (ids.has(e.from) && ids.has(e.to) && e.from !== e.to) { preds.get(e.to).push(e.from); succs.get(e.from).push(e.to); }
  const layer = new Map(), visiting = new Set();
  const L = (id) => {
    if (layer.has(id)) return layer.get(id);
    if (visiting.has(id)) return 0;
    visiting.add(id);
    let l = 0;
    for (const p of preds.get(id)) l = Math.max(l, L(p) + 1);
    visiting.delete(id); layer.set(id, l);
    return l;
  };
  nodes.forEach((n) => L(n.id));
  const layers = [];
  nodes.forEach((n) => (layers[layer.get(n.id)] ||= []).push(n.id));
  for (let i = 0; i < layers.length; i++) layers[i] ||= [];
  const pos = new Map();
  layers.forEach((ls) => ls.forEach((id, i) => pos.set(id, i)));
  const bary = (id, adj) => { const ns = adj.get(id); return ns.length ? ns.reduce((a, n) => a + pos.get(n), 0) / ns.length : pos.get(id); };
  for (let it = 0; it < 6; it++) {
    for (let l = 1; l < layers.length; l++) { layers[l].sort((a, b) => bary(a, preds) - bary(b, preds)); layers[l].forEach((id, i) => pos.set(id, i)); }
    for (let l = layers.length - 2; l >= 0; l--) { layers[l].sort((a, b) => bary(a, succs) - bary(b, succs)); layers[l].forEach((id, i) => pos.set(id, i)); }
  }
  const maxN = Math.max(1, ...layers.map((l) => l.length));
  const lr = (xy) => {
    layers.forEach((ls, l) => {
      const off = ((maxN - ls.length) * (H + GY)) / 2;
      ls.forEach((id, i) => xy.set(id, { x: l * (W + GX), y: off + i * (H + GY), l }));
    });
    return { xy, dir: "LR", width: layers.length * (W + GX) - GX, height: maxN * (H + GY) - GY };
  };
  const tb = (xy) => {
    const SX = 36, SY = 62;
    layers.forEach((ls, l) => {
      const off = ((maxN - ls.length) * (W + SX)) / 2;
      ls.forEach((id, i) => xy.set(id, { x: off + i * (W + SX), y: l * (H + SY), l }));
    });
    return { xy, dir: "TB", width: maxN * (W + SX) - SX, height: layers.length * (H + SY) - SY };
  };
  return { lr: lr(new Map()), tb: tb(new Map()) };
}

// ---------------------------------------------------------------- SVG graph with pan/zoom
function drawGraph({ nodes, edges, renderNode, W = 210, H = 66, GX = 90, GY = 28, key, onSelect, selectedId, hlFrom }) {
  const view = $("#view");
  const vw = view.clientWidth || 800, vh = view.clientHeight || 600;
  const both = layout(nodes, edges, W, H, GX, GY);
  const fit = (g) => Math.min(1.2, (vw - 80) / Math.max(g.width, 1), (vh - 90) / Math.max(g.height, 1));
  // Pick whichever orientation fits the viewport at the larger scale; keep it stable per graph.
  if (state.fitKey !== key || !state.dir) state.dir = fit(both.tb) > fit(both.lr) * 1.15 ? "TB" : "LR";
  const { xy, width, height, dir } = state.dir === "TB" ? both.tb : both.lr;
  if (state.fitKey !== key || !state.transform) {
    // Fit, but never shrink labels below legibility; overflow is reachable by panning.
    const k = Math.max(0.8, Math.min(1.2, (vw - 80) / Math.max(width, 1), (vh - 90) / Math.max(height, 1)));
    const x = width * k > vw - 80 ? 40 : (vw - width * k) / 2;
    state.transform = { k, x, y: Math.max(30, (vh - height * k) / 2 - 10) };
    state.fitKey = key;
  }
  const sel = selectedId || "";
  const merged = new Map();  // several artifacts between the same pair of nodes -> one labelled edge
  for (const e of edges) {
    const k = `${e.from}\u0000${e.to}`;
    if (!merged.has(k)) merged.set(k, { ...e, label: e.label || "" });
    else if (e.label && !merged.get(k).label.split(", ").includes(e.label)) merged.get(k).label += `, ${e.label}`;
  }
  edges = [...merged.values()];
  const edgeSvg = edges.filter((e) => xy.has(e.from) && xy.has(e.to)).map((e) => {
    const a = xy.get(e.from), b = xy.get(e.to);
    let d, lx, ly;
    const span = b.l - a.l;
    if (span > 1) {
      // Skip-layer edge: bow out to the side so it doesn't run behind intermediate nodes.
      const bow = 40 + 18 * span;
      if (dir === "TB") {
        const x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x + W + 6, y2 = b.y + H / 2;
        d = `M${x1},${y1} C${x1 + bow},${y1} ${x2 + bow},${y2} ${x2},${y2}`; lx = (x1 + x2) / 2 + bow * 0.75; ly = (y1 + y2) / 2;
      } else {
        const x1 = a.x + W / 2, y1 = a.y + H, x2 = b.x + W / 2, y2 = b.y + H + 6;
        d = `M${x1},${y1} C${x1},${y1 + bow} ${x2},${y2 + bow} ${x2},${y2}`; lx = (x1 + x2) / 2; ly = (y1 + y2) / 2 + bow * 0.75;
      }
    } else if (dir === "TB") {
      const x1 = a.x + W / 2, y1 = a.y + H, x2 = b.x + W / 2, y2 = b.y, my = (y1 + y2) / 2;
      d = `M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2 - 6}`; lx = (x1 + x2) / 2; ly = my;
    } else {
      const x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x, y2 = b.y + H / 2, mx = (x1 + x2) / 2;
      d = `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2 - 6},${y2}`; lx = mx; ly = (y1 + y2) / 2;
    }
    const hl = sel && (e.from === sel || e.to === sel) ? "hl" : "";
    const label = esc(e.label || "");
    const lw = Math.max(20, label.length * 6.4 + 10);
    return `<g class="edge ${hl}"><path d="${d}" marker-end="url(#arrow)"/>
      ${label ? `<rect x="${lx - lw / 2}" y="${ly - 8}" width="${lw}" height="15" rx="4"/><text x="${lx}" y="${ly + 3.5}" text-anchor="middle">${label}</text>` : ""}</g>`;
  }).join("");
  const nodeSvg = nodes.map((n) => { const p = xy.get(n.id); return `<g class="node ${n._cls || ""} ${n.id === sel ? "sel" : ""}" data-node="${esc(n.id)}" transform="translate(${p.x},${p.y})">${renderNode(n, W, H)}</g>`; }).join("");
  const t = state.transform;
  view.innerHTML = `<svg class="canvas" id="canvas"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--edge)"/></marker></defs>
    <g id="world" transform="translate(${t.x},${t.y}) scale(${t.k})">${edgeSvg}${nodeSvg}</g></svg>
    <div class="legend">${STATUSES.map((s) => `<span><i class="dot" style="background:${cssVar(s)}"></i>${s}</span>`).join("")}</div>
    <div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zfit">Fit</button></div>`;
  wirePanZoom(onSelect);
  $("#zfit").onclick = () => { state.transform = null; state.fitKey = null; state.dir = null; refresh(false); };
  $("#zin").onclick = () => zoomBy(1.2);
  $("#zout").onclick = () => zoomBy(1 / 1.2);
}
function applyTransform() { const t = state.transform; const w = $("#world"); if (w) w.setAttribute("transform", `translate(${t.x},${t.y}) scale(${t.k})`); }
function zoomBy(f, cx, cy) {
  const t = state.transform, v = $("#view");
  cx ??= v.clientWidth / 2; cy ??= v.clientHeight / 2;
  const k = Math.min(3, Math.max(0.2, t.k * f));
  t.x = cx - ((cx - t.x) * k) / t.k; t.y = cy - ((cy - t.y) * k) / t.k; t.k = k;
  applyTransform();
}
function wirePanZoom(onSelect) {
  const svg = $("#canvas");
  let drag = null, moved = false;
  svg.addEventListener("wheel", (e) => { e.preventDefault(); const r = svg.getBoundingClientRect(); zoomBy(e.deltaY < 0 ? 1.1 : 1 / 1.1, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
  svg.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, tx: state.transform.x, ty: state.transform.y }; moved = false; });
  window.onpointermove = (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) { moved = true; svg.classList.add("dragging"); }
    state.transform.x = drag.tx + dx; state.transform.y = drag.ty + dy; applyTransform();
  };
  window.onpointerup = (e) => {
    if (drag && !moved) { const n = e.target.closest && e.target.closest("[data-node]"); if (n) onSelect(n.dataset.node); }
    drag = null; svg.classList.remove("dragging");
  };
}

// ---------------------------------------------------------------- experiment DAG
function renderDag() {

    nodes: d.nodes, edges: d.edges, key: `dag:${d.experiment.id}`, selectedId: state.selected?.type === "node" ? state.selected.id : null,

// ---------------------------------------------------------------- params / metrics
function flatten(obj, prefix = "", out = {}) {
  for (const [k, v] of Object.entries(obj || {})) {
    if (v && typeof v === "object" && !Array.isArray(v) && Object.keys(v).length) flatten(v, `${prefix}${k}.`, out);
    else out[`${prefix}${k}`] = v;
  }
  return out;
}
function renderParams() {
  const d = state.dag; renderToolbar(d.experiment);
  const overrides = flatten(d.experiment.params);
  const rows = d.nodes.filter((n) => n.kind === "node").flatMap((n) => Object.entries(n.params || {}).map(([k, v]) => {
    const key = `${n.name}.${k}`;
    return `<tr><td class="mono">${esc(key)}</td><td class="mono">${esc(fmtVal(v))}</td><td>${key in overrides ? "experiment" : "default / call"}</td></tr>`;
  }));
  const pins = Object.entries(d.experiment.pins || {}).flatMap(([node, outs]) => Object.entries(outs).map(([o, h]) => `<tr><td class="mono">${esc(node)}.${esc(o)}</td><td><span class="chip" data-artifact="${esc(h)}">${esc(short(h, 12))}</span></td></tr>`));

    ${pins.length ? `<h3 style="margin-top:24px">Pinned outputs</h3><table><tr><th>output</th><th>artifact</th></tr>${pins.join("")}</table>` : ""}
  </div>`;
}
function renderMetrics() {

// ---------------------------------------------------------------- diff

    <h3 style="margin-top:24px">Metrics</h3><table><tr><th>node</th><th>metric</th><th style="text-align:right">A</th><th style="text-align:right">B</th><th style="text-align:right">Δ</th></tr>${metrics || `<tr><td colspan=5 style="color:var(--muted)">No metrics.</td></tr>`}</table>

async function loadSparks(execId) {
  const ex = await api(`/api/executions/${execId}`);
  const series = {};
  ex.metrics.forEach((m) => (series[m.key] ||= []).push(m));
  const el = $("#spark"); if (!el) return;
  el.innerHTML = Object.entries(series).filter(([, s]) => s.length > 1).map(([k, s]) => {
    const xs = s.map((m) => m.step), ys = s.map((m) => m.value);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const pts = s.map((m) => `${(8 + ((m.step - x0) / (x1 - x0 || 1)) * 300).toFixed(1)},${(42 - ((m.value - y0) / (y1 - y0 || 1)) * 34).toFixed(1)}`).join(" ");
    return `<div style="margin-top:10px"><div class="mono" style="color:var(--muted)">${esc(k)} over ${s.length} steps</div>
      <svg viewBox="0 0 316 48" width="100%" height="48" role="img" aria-label="${esc(k)} trend"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2"/></svg></div>`;
  }).join("");
}

  $("#detail").innerHTML = `<section><h3>Execution</h3><h4>${esc(x.node)}</h4>
    <dl class="kv"><dt>id</dt><dd class="mono">${esc(x.id)}</dd><dt>status</dt><dd>${esc(x.status)}</dd>
    <dt>signature</dt><dd class="mono">${esc(x.signature)}</dd><dt>cacheable</dt><dd>${x.cacheable ? "yes" : "no"}</dd>
    <dt>duration</dt><dd>${esc(fmtDur(x.finished_at && x.finished_at - x.started_at))}</dd><dt>started</dt><dd>${esc(fmtTime(x.started_at))}</dd>
    ${x.task_run_id ? `<dt>prefect task</dt><dd class="mono">${esc(x.task_run_id)}</dd>` : ""}</dl>
    ${x.error ? `<pre class="err" style="margin-top:10px">${esc(x.error)}</pre>` : ""}</section>
    <section><h3>Inputs</h3>${Object.entries(x.inputs).map(([k, h]) => `<span class="chip" data-artifact="${esc(h)}"><b>${esc(k)}</b> ${esc(short(h, 8))}</span>`).join("") || "—"}</section>
    <section><h3>Outputs</h3>${Object.entries(x.outputs).map(([k, h]) => `<span class="chip" data-artifact="${esc(h)}"><b>${esc(k)}</b> ${esc(short(h, 8))}</span>`).join("") || "—"}</section>
    <section><h3>Reused by ${x.used_by.length} node run${x.used_by.length === 1 ? "" : "s"}</h3>${x.used_by.map((u) => `<div><a data-go="#/exp/${esc(u.experiment_id)}">${esc(u.name || u.experiment_id)}</a> <span class="mono" style="color:var(--muted)">${esc(u.experiment_id)}</span> <span style="color:var(--muted);font-size:12px">${esc(u.node)} · ${esc(u.status)}</span></div>`).join("")}</section>
    <section><h3>Signature spec</h3><pre>${esc(JSON.stringify(x.spec, null, 2))}</pre></section>`;
}

// ---------------------------------------------------------------- boot
api("/api/info").then((i) => ($("#meta").textContent = `db ${i.db} · store ${i.store}`)).catch(() => {});
window.addEventListener("resize", () => { state.fitKey = null; state.dir = null; });
route();
</script>
</body>
</html>
